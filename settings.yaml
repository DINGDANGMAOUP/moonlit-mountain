apiVersion: v1alpha1
kind: Setting
metadata:
  name: moonlit-mountain-setting
spec:
  forms:
    - group: style
      label: 外观
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 默认月相
          help: 访客首次打开时使用；访客仍可在页面右上角切换并保留自己的选择
          value: midnight
          options:
            - label: 深夜
              value: midnight
            - label: 暮色
              value: twilight
            - label: 月白
              value: moonlight
            - label: 跟随系统
              value: system
    - group: home
      label: 首页内容
      formSchema:
        - $formkit: attachment
          name: hero_image
          label: Hero 图片
          help: 留空时使用主题内置图片
          accepts:
            - image/*
          value: ""
        - $formkit: text
          name: hero_primary_label
          label: 首页主按钮名称
          help: 留空时使用当前语言的“阅读文章”
          value: ""
        - $formkit: text
          name: hero_primary_url
          label: 首页主按钮链接
          help: 支持 http(s)://、mailto:、站内路径或 # 锚点；清空后隐藏该按钮
          value: "/archives"
        - $formkit: text
          name: hero_secondary_label
          label: 首页次按钮名称
          help: 留空时使用当前语言的“浏览分类”
          value: ""
        - $formkit: text
          name: hero_secondary_url
          label: 首页次按钮链接
          help: 支持 http(s)://、mailto:、站内路径或 # 锚点；清空后隐藏该按钮
          value: "/categories"
        - $formkit: singlePageSelect
          name: about_page
          label: 关于页面
          help: 选中页面的标题、摘要和链接会用于首页介绍
          clearable: true
          autoSelect: false
          value: ""
        - $formkit: categorySelect
          name: featured_category
          label: 精选分类
          help: 留空时展示当前首页文章
          clearable: true
          autoSelect: false
          value: ""
        - $formkit: singlePageSelect
          name: contact_page
          label: 联系页面
          help: 选中后在首页展示联系入口，留空则不显示
          clearable: true
          autoSelect: false
          value: ""
    - group: navigation
      label: 导航
      formSchema:
        - $formkit: switch
          name: enable_multilingual
          label: 开启多语言
          help: 在前台导航中显示简体中文与 English 语言切换器
          value: true
        - $formkit: array
          name: social_media
          label: 社交媒体
          help: 拖动调整顶部右侧的显示顺序；图片类型请填写 Halo 附件地址
          value: []
          max: 5
          addLabel: 添加
          emptyText: 暂未配置社交媒体
          itemLabels:
            - type: text
              label: "$value.name"
            - type: text
              label: "$value.url"
          children:
            - $formkit: iconify
              name: icon
              label: 图标
              format: dataurl
              validation: required
            - $formkit: text
              name: name
              label: 名称
              value: ""
              validation: required
            - $formkit: text
              name: url
              label: 链接
              help: 支持 http(s)://、mailto:、站内路径或 Halo 附件地址；其他协议不会在前台渲染
              value: ""
              validation: required
            - $formkit: select
              name: url_type
              label: 链接类型
              value: normal
              clearable: false
              options:
                - label: 跳转链接
                  value: normal
                - label: 图片
                  value: image
    - group: post
      label: 文章阅读
      formSchema:
        - $formkit: switch
          name: enable_reader_settings
          label: 阅读设置
          help: 在文章页显示字号、行高和正文宽度调节面板
          value: true
    - group: footer
      label: 页脚与备案
      formSchema:
        - $formkit: text
          name: icp_number
          label: ICP备案号
          help: 填写完整备案号，例如“京ICP备12345678号-1”；留空时不显示
          value: ""
        - $formkit: url
          name: icp_url
          label: ICP备案跳转链接
          help: 可填写备案详情或查询地址；留空或协议不安全时使用工信部备案系统
          value: "https://beian.miit.gov.cn/"
        - $formkit: text
          name: public_security_number
          label: 公安联网备案号
          help: 填写完整备案号，例如“京公网安备 11010502030143 号”；留空时不显示
          value: ""
        - $formkit: url
          name: public_security_url
          label: 公安联网备案跳转链接
          help: 可填写备案详情或查询地址；留空或协议不安全时使用全国互联网安全管理服务平台
          value: "https://beian.mps.gov.cn/#/query/webSearch"
        - $formkit: attachment
          name: public_security_icon
          label: 公安备案图标
          help: 可上传备案平台提供的图标；留空时使用主题内置的单色盾牌图标
          accepts:
            - image/*
          value: ""
