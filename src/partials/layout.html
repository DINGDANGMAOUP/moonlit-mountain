<!doctype html>
<html
  lang="zh-CN"
  th:lang="${#locale.toLanguageTag()}"
  data-color-scheme="dark"
  data-moon-phase="midnight"
  data-resolved-moon-phase="midnight"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <include src="moon-phase-bootstrap.html"></include>
    <slot name="head">
      <title th:text="${site.title}">山月记</title>
    </slot>
    <script th:inline="javascript">
      window.MoonlitMountainI18n = {
        locale: /*[[${#locale.toLanguageTag()}]]*/ "zh-CN",
        messages: {
          momentUpvote: /*[[#{moment.upvote.ariaLabel}]]*/ "喜欢这个瞬间",
          momentUpvoted: /*[[#{moment.upvote.activeLabel}]]*/ "已喜欢这个瞬间",
          momentUpvotePending: /*[[#{moment.upvote.pending}]]*/ "正在记录喜欢。",
          momentUpvoteSuccess: /*[[#{moment.upvote.success}]]*/ "已喜欢这个瞬间。",
          momentUpvoteError: /*[[#{moment.upvote.error}]]*/ "暂时无法记录喜欢，请稍后重试。",
          unknownTime: /*[[#{link.feed.timeUnknown}]]*/ "时间未记录",
          untitledUpdate: /*[[#{link.feed.untitled}]]*/ "未命名近况",
          friendSite: /*[[#{link.feed.neighbor}]]*/ "友邻站点",
          feedSourceLabel: /*[[#{link.feed.visitSource}]]*/ "访问订阅来源：{0}",
          feedStoryLabel: /*[[#{link.feed.readStory}]]*/ "阅读 {0} 的文章：{1}",
          read: /*[[#{link.feed.read}]]*/ "阅读",
          feedUnavailable: /*[[#{link.feed.unavailable}]]*/ "原文地址暂不可用",
          feedLoadMore: /*[[#{page.links.feed.loadEarlier}]]*/ "查看更早近况",
          feedLoadingButton: /*[[#{page.links.feed.loadingButton}]]*/ "正在捎来…",
          feedLoadingStatus: /*[[#{page.links.feed.loadingStatus}]]*/ "正在加载更早近况。",
          feedLoaded: /*[[#{page.links.feed.loaded}]]*/ "已加载 {0} 条更早近况。",
          feedReachedStart: /*[[#{page.links.feed.reachedStart}]]*/ "已抵达最早一篇",
          feedLoadedReachedStart: /*[[#{page.links.feed.loadedReachedStart}]]*/ "已加载 {0} 条更早近况，已经抵达最早一篇。",
          feedRetry: /*[[#{page.links.feed.retry}]]*/ "重试查看更早近况",
          feedError: /*[[#{page.links.feed.error}]]*/ "这次没能捎来更早近况，请重试。",
          submenuExpand: /*[[#{nav.submenu.expand}]]*/ "展开 {0} 子菜单",
          submenuCollapse: /*[[#{nav.submenu.collapse}]]*/ "收起 {0} 子菜单",
          submenuCurrent: /*[[#{nav.submenu.current}]]*/ "当前",
          menuOpen: /*[[#{nav.menu.open}]]*/ "打开菜单",
          menuClose: /*[[#{nav.menu.close}]]*/ "关闭菜单",
          socialDefaultName: /*[[#{nav.social.defaultName}]]*/ "社交媒体",
          socialImageAlt: /*[[#{nav.social.imageAlt}]]*/ "{0} 图片",
          tocSection: /*[[#{page.post.toc.section}]]*/ "章节 {0}",
          tocOpen: /*[[#{page.post.openToc}]]*/ "打开文章目录",
          tocClose: /*[[#{page.post.closeToc}]]*/ "关闭文章目录",
          readingTime: /*[[#{page.post.readingTimeValue}]]*/ "约 {0} 分钟阅读",
          shareComplete: /*[[#{page.post.shareComplete}]]*/ "分享完成。",
          linkCopied: /*[[#{page.post.linkCopied}]]*/ "链接已复制，可以粘贴分享。",
          shareError: /*[[#{page.post.shareError}]]*/ "暂时无法分享，请复制地址栏链接。",
          readerReset: /*[[#{page.post.readerReset}]]*/ "已恢复默认排版。"
        }
      };
    </script>
    <script type="module" src="/js/main.ts"></script>
  </head>
  <body
    th:attr="data-template=${_templateId}"
    th:data-archives-uri="${site.routes.archivesUri}"
    th:data-categories-uri="${site.routes.categoriesUri}"
    th:data-tags-uri="${site.routes.tagsUri}"
  >
    <a class="skip-link" href="#content" th:text="#{layout.skipToContent}">跳到正文</a>
    <div class="page-progress" aria-hidden="true" data-page-progress></div>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-mark" data-home-mark th:href="@{/}" th:aria-label="${#messages.msg('layout.backHome', site.title)}">
          <img
            src="./assets/images/moonlit-mountain-hero.jpg"
            th:src="${not #strings.isEmpty(site.logo) ? site.logo : #theme.assets('/images/moonlit-mountain-hero.jpg')}"
            th:alt="${site.title}"
          />
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-navigation"
          th:aria-label="#{nav.menu.open}"
          data-menu-toggle
        >
          <span class="menu-toggle__label menu-toggle__label--open" th:text="#{nav.menu.label}">菜单</span>
          <span class="menu-toggle__label menu-toggle__label--close" th:text="#{common.close}">关闭</span>
          <svg class="menu-toggle__chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
        </button>

        <button
          class="menu-backdrop"
          type="button"
          th:aria-label="#{nav.menu.close}"
          aria-hidden="true"
          tabindex="-1"
          data-menu-backdrop
        ></button>

        <div class="header-actions" id="primary-navigation" data-menu-panel>
          <nav class="site-nav" th:aria-label="#{nav.primary}" data-nav-track th:with="menu = ${menuFinder.getPrimary()}">
            <ul th:if="${not #lists.isEmpty(menu?.menuItems)}">
              <th:block th:replace="~{menu-items :: items(${menu.menuItems}, 1)}"></th:block>
            </ul>
            <ul th:if="${#lists.isEmpty(menu?.menuItems)}">
              <li><a th:href="@{${site.routes.archivesUri + '/'}}" th:text="#{nav.archives}">归档</a></li>
              <li><a th:href="@{${site.routes.categoriesUri}}" th:text="#{nav.categories}">分类</a></li>
              <li><a th:href="@{${site.routes.tagsUri}}" th:text="#{nav.tags}">标签</a></li>
              <li th:if="${pluginFinder.available('PluginMoments', '>=1.16.1')}"><a th:href="@{/moments}" th:text="#{nav.moments}">瞬间</a></li>
              <li th:if="${pluginFinder.available('PluginPhotos', '>=2.0.0')}"><a th:href="@{/photos}" th:text="#{nav.photos}">图库</a></li>
              <li th:if="${pluginFinder.available('PluginLinks', '>=2.2.1')}"><a th:href="@{/links}" th:text="#{nav.links}">友链</a></li>
            </ul>
            <span class="nav-indicator-viewport" aria-hidden="true">
              <span class="nav-indicator" data-nav-indicator></span>
            </span>
          </nav>

          <svg class="moon-phase-symbols" aria-hidden="true" focusable="false">
            <symbol id="moonlit-mountain-phase-midnight" viewBox="0 0 20 20">
              <path d="M4.8 15.2A7.35 7.35 0 1 1 15.2 15.2" fill="none" stroke="#52525b" stroke-linecap="round" stroke-width="1.2"></path>
              <path d="M10.25 5.2a4.8 4.8 0 1 0 3.1 8.45 5.45 5.45 0 0 1-3.1-8.45Z" fill="#facc15"></path>
              <circle cx="4.8" cy="15.2" r="1.05" fill="#0ea5e9"></circle>
            </symbol>
            <symbol id="moonlit-mountain-phase-twilight" viewBox="0 0 20 20">
              <path d="M4.8 15.2A7.35 7.35 0 1 1 15.2 15.2" fill="none" stroke="#5c6c66" stroke-linecap="round" stroke-width="1.2"></path>
              <circle cx="10" cy="10" r="4.35" fill="#5eb2c1" fill-opacity=".26" stroke="#5eb2c1" stroke-width="1"></circle>
              <path d="M5.65 10h8.7a4.35 4.35 0 0 1-8.7 0Z" fill="#e9b65f"></path>
              <circle cx="15.2" cy="15.2" r="1.05" fill="#e9b65f"></circle>
            </symbol>
            <symbol id="moonlit-mountain-phase-moonlight" viewBox="0 0 20 20">
              <path d="M4.8 15.2A7.35 7.35 0 1 1 15.2 15.2" fill="none" stroke="#73898b" stroke-linecap="round" stroke-width="1.2"></path>
              <circle cx="10" cy="10" r="4.45" fill="#d1dddf" stroke="#0c6570" stroke-width="1"></circle>
              <circle cx="8.6" cy="8.75" r=".62" fill="#8fa7a8"></circle>
              <circle cx="11.55" cy="11.45" r=".42" fill="#8fa7a8"></circle>
              <circle cx="4.8" cy="15.2" r="1.05" fill="#835c0f"></circle>
            </symbol>
            <symbol id="moonlit-mountain-phase-system" viewBox="0 0 20 20">
              <path d="M10 2.6A7.4 7.4 0 0 0 10 17.4" fill="none" stroke="#52525b" stroke-linecap="round" stroke-width="1.2"></path>
              <path d="M10 2.6A7.4 7.4 0 0 1 10 17.4" fill="none" stroke="#73898b" stroke-linecap="round" stroke-width="1.2"></path>
              <circle cx="10" cy="10" r="4.35" fill="#e8eff0" stroke="#73898b" stroke-width="1"></circle>
              <path d="M10 5.65v8.7a4.35 4.35 0 0 1 0-8.7Z" fill="#18181b"></path>
              <circle cx="10" cy="2.6" r=".95" fill="#facc15"></circle>
              <circle cx="10" cy="17.4" r=".95" fill="#0ea5e9"></circle>
            </symbol>
          </svg>

          <details class="moon-phase-switcher" data-header-preference-switcher data-moon-phase-switcher>
            <summary th:aria-label="#{nav.moonPhase}" th:title="#{nav.moonPhase}">
              <svg class="moon-phase-symbol moon-phase-symbol--trigger" aria-hidden="true" focusable="false" viewBox="0 0 20 20">
                <use data-phase-icon="midnight" href="#moonlit-mountain-phase-midnight"></use>
                <use data-phase-icon="twilight" href="#moonlit-mountain-phase-twilight"></use>
                <use data-phase-icon="moonlight" href="#moonlit-mountain-phase-moonlight"></use>
                <use data-phase-icon="system" href="#moonlit-mountain-phase-system"></use>
              </svg>
              <span class="moon-phase-switcher__label" th:text="#{nav.moonPhase}">月相</span>
              <span class="moon-phase-switcher__current" data-moon-phase-current aria-hidden="true" th:text="#{moonPhase.midnight}">深夜</span>
              <svg class="moon-phase-switcher__chevron" aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"></path></svg>
            </summary>
            <fieldset class="moon-phase-switcher__panel">
              <legend class="sr-only" th:text="#{nav.moonPhase}">月相</legend>
              <label class="moon-phase-option" data-phase="midnight">
                <input type="radio" name="moon-phase" value="midnight" data-moon-phase-option checked />
                <svg class="moon-phase-symbol" aria-hidden="true" focusable="false" viewBox="0 0 20 20"><use href="#moonlit-mountain-phase-midnight"></use></svg>
                <span class="moon-phase-option__copy">
                  <strong th:text="#{moonPhase.midnight}">深夜</strong>
                  <small class="sr-only" th:text="#{moonPhase.midnight.description}">当前深色品牌</small>
                </span>
              </label>
              <label class="moon-phase-option" data-phase="twilight">
                <input type="radio" name="moon-phase" value="twilight" data-moon-phase-option />
                <svg class="moon-phase-symbol" aria-hidden="true" focusable="false" viewBox="0 0 20 20"><use href="#moonlit-mountain-phase-twilight"></use></svg>
                <span class="moon-phase-option__copy">
                  <strong th:text="#{moonPhase.twilight}">暮色</strong>
                  <small class="sr-only" th:text="#{moonPhase.twilight.description}">蓝时与余晖</small>
                </span>
              </label>
              <label class="moon-phase-option" data-phase="moonlight">
                <input type="radio" name="moon-phase" value="moonlight" data-moon-phase-option />
                <svg class="moon-phase-symbol" aria-hidden="true" focusable="false" viewBox="0 0 20 20"><use href="#moonlit-mountain-phase-moonlight"></use></svg>
                <span class="moon-phase-option__copy">
                  <strong th:text="#{moonPhase.moonlight}">月白</strong>
                  <small class="sr-only" th:text="#{moonPhase.moonlight.description}">银纸与墨色</small>
                </span>
              </label>
              <label class="moon-phase-option" data-phase="system">
                <input type="radio" name="moon-phase" value="system" data-moon-phase-option />
                <svg class="moon-phase-symbol" aria-hidden="true" focusable="false" viewBox="0 0 20 20"><use href="#moonlit-mountain-phase-system"></use></svg>
                <span class="moon-phase-option__copy">
                  <strong th:text="#{moonPhase.system}">跟随系统</strong>
                  <small class="sr-only" th:text="#{moonPhase.system.description}">随设备明暗</small>
                </span>
              </label>
            </fieldset>
          </details>

          <details
            class="moon-phase-switcher language-switcher"
            data-header-preference-switcher
            data-language-switcher
            th:if="${theme.config?.navigation?.enable_multilingual != false}"
          >
            <summary th:aria-label="#{nav.language}" th:title="#{nav.language}">
              <svg class="language-switcher__globe" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path>
              </svg>
              <span class="moon-phase-switcher__label" th:text="#{nav.language}">语言</span>
              <span
                class="moon-phase-switcher__current"
                th:text="${#strings.startsWith(#locale.toLanguageTag(), 'zh') ? #messages.msg('language.zhCN') : #messages.msg('language.en')}"
              >简体中文</span>
              <svg class="moon-phase-switcher__chevron" aria-hidden="true" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"></path></svg>
            </summary>
            <fieldset class="moon-phase-switcher__panel">
              <legend class="sr-only" th:text="#{nav.language}">语言</legend>
              <label class="moon-phase-option">
                <input
                  type="radio"
                  name="site-language"
                  value="zh-CN"
                  data-language-option
                  checked
                  th:checked="${#strings.startsWith(#locale.toLanguageTag(), 'zh')}"
                />
                <span class="moon-phase-option__copy"><strong th:text="#{language.zhCN}">简体中文</strong></span>
              </label>
              <label class="moon-phase-option">
                <input
                  type="radio"
                  name="site-language"
                  value="en"
                  data-language-option
                  th:checked="${not #strings.startsWith(#locale.toLanguageTag(), 'zh')}"
                />
                <span class="moon-phase-option__copy"><strong th:text="#{language.en}">English</strong></span>
              </label>
            </fieldset>
          </details>

          <th:block th:with="socials = ${theme.config?.navigation?.social_media}">
            <nav class="social-nav" th:aria-label="#{nav.social.label}" data-nav-track th:if="${not #lists.isEmpty(socials)}">
              <th:block
                th:each="social : ${socials}"
                th:with="
                  socialName = ${#strings.isEmpty(social.name) ? #messages.msg('nav.social.defaultName') : social.name},
                  socialUrl = ${social.url ?: ''},
                  socialType = ${social.url_type ?: 'normal'},
                  socialIcon = ${social.icon?.value ?: ''},
                  socialUrlLower = ${#strings.toLowerCase(socialUrl)},
                  socialIsHttp = ${#strings.startsWith(socialUrlLower, 'https://') or #strings.startsWith(socialUrlLower, 'http://')},
                  socialIsExternal = ${socialIsHttp or #strings.startsWith(socialUrl, '//')},
                  socialIsSafeLink = ${socialIsExternal or #strings.startsWith(socialUrlLower, 'mailto:') or #strings.startsWith(socialUrl, '/') or #strings.startsWith(socialUrl, './') or #strings.startsWith(socialUrl, '../') or #strings.startsWith(socialUrl, '#')},
                  socialIsSafeImage = ${socialIsHttp or #strings.startsWith(socialUrl, '/') or #strings.startsWith(socialUrl, './') or #strings.startsWith(socialUrl, '../')}
                "
              >
                <a
                  th:if="${socialType != 'image' and not #strings.isEmpty(socialUrl) and socialIsSafeLink}"
                  th:href="@{${socialUrl}}"
                  th:target="${socialIsExternal ? '_blank' : null}"
                  th:rel="${socialIsExternal ? 'noopener noreferrer' : null}"
                  th:aria-label="${#messages.msg('nav.social.visit', socialName)}"
                  th:title="${socialName}"
                >
                  <span
                    class="social-nav__icon"
                    aria-hidden="true"
                    th:if="${not #strings.isEmpty(socialIcon)}"
                    th:attr="data-social-icon=${socialIcon}"
                  ></span>
                  <svg class="social-nav__icon-fallback" aria-hidden="true" viewBox="0 0 24 24"><path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-1.5 1.5M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l1.5-1.5" /></svg>
                  <span class="sr-only" th:text="${socialName}">社交媒体</span>
                </a>
                <button
                  class="social-action"
                  type="button"
                  aria-haspopup="dialog"
                  aria-controls="social-image-dialog"
                  th:if="${socialType == 'image' and not #strings.isEmpty(socialUrl) and socialIsSafeImage}"
                  th:aria-label="${#messages.msg('nav.social.viewImage', socialName)}"
                  th:title="${socialName}"
                  th:attr="data-social-image-src=${socialUrl},data-social-image-name=${socialName}"
                  data-social-image-trigger
                >
                  <span
                    class="social-nav__icon"
                    aria-hidden="true"
                    th:if="${not #strings.isEmpty(socialIcon)}"
                    th:attr="data-social-icon=${socialIcon}"
                  ></span>
                  <svg class="social-nav__icon-fallback" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 15l4-4 3 3 2-2 7 7M15 9h.01" /></svg>
                  <span class="sr-only" th:text="${socialName}">社交媒体图片</span>
                </button>
              </th:block>
              <button class="social-action" type="button" th:aria-label="#{nav.search}" th:if="${pluginFinder.available('PluginSearchWidget')}" data-search-trigger>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z" /></svg>
              </button>
              <span class="nav-indicator-viewport" aria-hidden="true">
                <span class="nav-indicator" data-nav-indicator></span>
              </span>
            </nav>
            <nav
              class="social-nav social-nav--fallback"
              th:aria-label="#{nav.tools}"
              data-nav-track
              th:if="${#lists.isEmpty(socials) and (pluginFinder.available('PluginFeed') or pluginFinder.available('PluginSearchWidget'))}"
            >
              <a th:if="${pluginFinder.available('PluginFeed')}" th:href="@{/rss.xml}" aria-label="RSS">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19v.01M4 4a16 16 0 0 1 16 16M4 11a9 9 0 0 1 9 9" /></svg>
              </a>
              <button class="social-action" type="button" th:aria-label="#{nav.search}" th:if="${pluginFinder.available('PluginSearchWidget')}" data-search-trigger>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0z" /></svg>
              </button>
              <span class="nav-indicator-viewport" aria-hidden="true">
                <span class="nav-indicator" data-nav-indicator></span>
              </span>
            </nav>
          </th:block>
        </div>
      </div>
    </header>

    <dialog
      class="social-image-dialog"
      id="social-image-dialog"
      aria-labelledby="social-image-dialog-title"
      data-social-image-dialog
    >
      <div class="social-image-dialog__panel">
        <button class="social-image-dialog__close" type="button" th:aria-label="#{nav.social.closeImage}" data-social-image-close>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
        <h2 id="social-image-dialog-title" data-social-image-title th:text="#{nav.social.defaultName}">社交媒体</h2>
        <img data-social-image-preview alt="" />
      </div>
    </dialog>

    <main class="site-main" id="content">
      <slot />
    </main>

    <include src="footer.html"></include>
  </body>
</html>
